<!doctype html><html lang="th"><head><meta charset="utf-8">
<style>
body{font:14px system-ui,sans-serif;width:290px;margin:0;padding:14px;background:#18191a;color:#e4e6eb}
h1{font-size:15px;margin:0 0 4px}.sub{color:#b0b3b8;font-size:12px;margin-bottom:8px}
label{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
input[type=number]{width:70px;background:#3a3b3c;color:#fff;border:0;border-radius:6px;padding:4px 6px}
.stat{margin-top:10px;padding:8px;background:#242526;border-radius:8px;font-size:13px;line-height:1.6}
button{background:#3a3b3c;color:#e4e6eb;border:0;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}
button:hover{background:#4e4f50}
h2{font-size:13px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
#list{max-height:200px;overflow:auto;background:#242526;border-radius:8px}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #3a3b3c}
.row:last-child{border:0}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#0866ff}.tag.tiktok{background:#fe2c55}
.empty{padding:10px;color:#b0b3b8;font-size:12px;text-align:center}
.tools{display:flex;gap:6px;margin-top:6px}
</style></head><body>
<h1>▶ Reels Auto Next</h1>
<div class="sub">Facebook Reels · TikTok</div>
<label>เลื่อนอัตโนมัติเมื่อจบ <input type="checkbox" id="enabled"></label>
<label>ข้ามโฆษณาอัตโนมัติ <input type="checkbox" id="skipAds"></label>
<label>ข้ามช่องที่แบนไว้ <input type="checkbox" id="skipBanned"></label>
<label>ข้ามคลิปเนื้อหา AI 🤖 <input type="checkbox" id="skipAI"></label>
<label>แสดงป้าย 🤖 บนคลิป AI <input type="checkbox" id="showAIBadge"></label>
<label>แสดงปุ่ม 🚫 แบนช่อง บนคลิป <input type="checkbox" id="showBanBtn"></label>
<label>หน่วงก่อนเลื่อน (ms) <input type="number" id="delay" min="0" step="100"></label>
<div class="stat">ข้ามโฆษณา: <b id="ads">0</b> · ข้ามช่องที่แบน: <b id="bans">0</b> · AI: <b id="ai">0</b> <button id="reset" style="float:right">ล้างสถิติ</button></div>
<h2>ช่องที่แบน (<span id="cnt">0</span>)</h2>
<div id="list"></div>
<div class="tools"><button id="export">ส่งออก</button><button id="import">นำเข้า</button><input type="file" id="file" accept=".json" hidden></div>
<script src="popup.js"></script></body></html>
